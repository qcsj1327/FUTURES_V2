<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FUTURES_V2 Trading Dashboard</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/ui/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">F</div>
          <div class="brand-name">FUTURES V2</div>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="side-status">
          <div class="side-status-title">系统状态</div>
          <div class="status-row"><span>Web 服务</span><b>运行中</b></div>
          <div class="status-row"><span>行情服务</span><b id="marketStatus">待选择</b></div>
          <div class="status-row"><span>执行服务</span><b id="execStatus">待选择</b></div>
          <div class="status-row"><span>Daemon</span><b id="daemonStatus">待选择</b></div>
          <div class="side-updated">
            <span>最后更新</span>
            <strong id="lastUpdated">—</strong>
            <button id="btnRefresh" class="icon-btn" title="刷新">↻</button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <section class="top-strip">
          <div class="field wide">
            <span>runtime_id</span>
            <div class="runtime-select-row">
              <select id="runSelect" class="run-select"></select>
              <button id="btnCopyRun" class="copy-btn" title="复制 runtime_id">⧉</button>
            </div>
          </div>
          <div class="field">
            <span>模式</span>
            <strong id="modeLabel">—</strong>
          </div>
          <div class="field wide">
            <span>审批状态</span>
            <strong id="approvalLabel">—</strong>
          </div>
          <div class="field">
            <span>自动刷新</span>
            <select id="refreshInterval" class="mini-select">
              <option value="0">关闭</option>
              <option value="5" selected>5s</option>
              <option value="10">10s</option>
              <option value="30">30s</option>
            </select>
          </div>
          <div class="field">
            <span>时间范围</span>
            <select id="timeRange" class="mini-select">
              <option value="realtime" selected>实时</option>
              <option value="1h">最近 1 小时</option>
              <option value="1d">最近 1 天</option>
            </select>
          </div>
          <div class="clock" id="clock">—</div>
        </section>

        <section id="view-home" class="view active"></section>
        <section id="view-run" class="view"></section>
        <section id="view-portfolio" class="view"></section>
        <section id="view-lifecycle" class="view"></section>
        <section id="view-risk" class="view"></section>
        <section id="view-switch" class="view"></section>
        <section id="view-gates" class="view"></section>
        <section id="view-roll" class="view"></section>
        <section id="view-market" class="view"></section>
        <section id="view-logs" class="view"></section>
        <section id="view-config" class="view"></section>
        <section id="view-alerts" class="view"></section>
        <section id="view-permissions" class="view"></section>
      </main>
    </div>

    <script src="/ui/app.js"></script>
  </body>
</html>
